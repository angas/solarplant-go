<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Solarplant</title>
  <!-- curl -s https://example.com/yada.min.js | openssl dgst -sha384 -binary | openssl base64 -A -->
  <script defer src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js"
    integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc"
    crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/htmx.org@4.0.0/dist/ext/hx-ws.min.js"
    integrity="sha384-8iDMDuKIquXLgObstxvwGlWD1bY/ALMH7k9rbC070qmZrRvJ0BGO+8xG+Ul+J0bP"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
    integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
    crossorigin="anonymous"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="/main.css">
  <script>
    window.addEventListener("load", () => {
      fetch(`/chart`)
        .then((res) => res.json())
        .then(data => {
          new Chart(document.getElementById('chart1'), data[0])
          new Chart(document.getElementById('chart2'), data[1])
        })
        .catch(console.error);
    });
    function toggleMenu() {
      document.getElementById('menu-dropdown').classList.toggle('visible');
    }
    function openMenu() {
      document.getElementById('menu-dropdown').classList.add('visible');
    }
    document.addEventListener('DOMContentLoaded', () => {
      let initialScroll = true;
      document.getElementById('data').addEventListener('htmx:after:settle', () => {
        if (initialScroll) {
          document.getElementById('current-slot')?.scrollIntoView({ block: 'center' });
          initialScroll = false;
        }
      });
    });
    // Click outside menu handler
    document.addEventListener('click', (event) => {
      const menuContainer = document.getElementById('menu-container');
      if (!menuContainer.contains(event.target)) {
        document.getElementById('menu-dropdown').classList.remove('visible');
      }
    });
  </script>
</head>

<body>
  <header>
    <nav id="menu-container">
      <button id="menu-button" aria-label="Menu" onclick="toggleMenu()" onmouseover="openMenu()">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <rect y="4" width="24" height="2" rx="1"></rect>
          <rect y="11" width="24" height="2" rx="1"></rect>
          <rect y="18" width="24" height="2" rx="1"></rect>
        </svg>
      </button>
      <div id="menu-dropdown">
        <button class="menu-item" hx-get="/timeseries" hx-target="#data" hx-on::finally:request="toggleMenu()">
          Time Series
        </button>
        <button class="menu-item" hx-get="/dailystats" hx-target="#data" hx-on::finally:request="toggleMenu()">
          Daily Stats
        </button>
        <button class="menu-item" hx-get="/log" hx-target="#data" hx-on::finally:request="toggleMenu()">
          Log
        </button>
      </div>
    </nav>
    <h1>Solarplant</h1>
  </header>
  <main>
    <div id="dashboard">
      <div hx-ws:connect="/ws" hx-target="#real_time_data" hx-swap="outerHTML">
        <div id="real_time_data"></div>
      </div>
      <div class="chart_container">
        <canvas id="chart1"></canvas>
      </div>
      <div class="chart_container">
        <canvas id="chart2"></canvas>
      </div>
    </div>
    <div id="data">
      <table hx-get="/timeseries" hx-trigger="load" hx-swap="outerHTML"></table>
    </div>
  </main>
  <footer hx-get="/sysinfo" hx-trigger="load, every 60m"></footer>
</body>

</html>
